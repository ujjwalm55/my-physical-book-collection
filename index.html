<main>

const STORAGE_KEY="myBookCollection.v3";
let books=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null")||INITIAL_BOOKS;
let field="all",regexMode=false,editingId=null;

const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function saveData(){localStorage.setItem(STORAGE_KEY,JSON.stringify(books));}
function match(book,q){
 if(!q)return true;
 const target=field==="title"?book.title:field==="author"?book.author:book.title+" — "+book.author;
 if(regexMode){try{return new RegExp(q,"i").test(target)}catch(e){return false}}
 const t=norm(target), tokens=norm(q).split(/\s+/).filter(Boolean);
 return tokens.every(x=>new RegExp("\\b"+x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i").test(t));
}
function hi(text,q){if(!q)return esc(text);try{
 if(regexMode)return esc(text).replace(new RegExp(q,"gi"),m=>"<mark>"+m+"</mark>");
 const ts=norm(q).split(/\s+/).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
 return esc(text).replace(new RegExp("\\b("+ts.join("|")+")\\b","ig"),m=>"<mark>"+m+"</mark>");
}catch(e){return esc(text)}}

function render(){
 const q=$("search").value.trim(), results=books.filter(b=>match(b,q));
 $("count").textContent=results.length; $("status").textContent=q?(regexMode?"Regex results":"Search results"):"Your collection";
 $("clear").style.display=q?"block":"none";
 if(!results.length){$("list").innerHTML='<div class="empty" style="grid-column:1/-1"><div style="font-size:40px">🔎</div><strong>No matching book found</strong><p>Try another search or add this book to your collection.</p></div>';return}
 $("list").innerHTML=results.map(b=>`<article class="card"><div class="title">${hi(b.title,q)}</div><div class="author">${hi(b.author,q)}</div>${b.isbn?`<div class="meta">ISBN: ${esc(b.isbn)}</div>`:""}<div class="actions"><button class="small" onclick="editBook(${b.id})">✏️ Edit</button><button class="small delete" onclick="deleteBook(${b.id})">🗑️ Delete</button></div></article>`).join("");
}

function openForm(book=null){
 editingId=book?book.id:null;$("formTitle").textContent=book?"Edit book":"Add book";
 $("bookTitle").value=book?book.title:"";$("bookAuthor").value=book?book.author:"";$("bookIsbn").value=book?book.isbn||"":"";
 $("overlay").classList.add("show");setTimeout(()=>$("bookTitle").focus(),100);
}
function closeForm(){$("overlay").classList.remove("show");editingId=null}
function addBook(){openForm()}
function editBook(id){const b=books.find(x=>x.id===id);if(b)openForm(b)}
function deleteBook(id){
 const b=books.find(x=>x.id===id);if(!b)return;
 if(confirm(`Remove "${b.title}" from your collection?`)){books=books.filter(x=>x.id!==id);saveData();render()}
}
function submit(){
 const title=$("bookTitle").value.trim(),author=$("bookAuthor").value.trim(),isbn=$("bookIsbn").value.trim();
 if(!title||!author){alert("Please enter both the book title and author.");return}
 if(editingId!==null){const b=books.find(x=>x.id===editingId);if(b){b.title=title;b.author=author;b.isbn=isbn}}
 else {books.push({id:Date.now(),title,author,isbn})}
 saveData();closeForm();render();
}

$("search").addEventListener("input",render);$("clear").onclick=()=>{$("search").value="";render();$("search").focus()};
$("addBtn").onclick=addBook;$("cancelBtn").onclick=closeForm;$("saveBtn").onclick=submit;
$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closeForm()});
document.querySelectorAll("[data-field]").forEach(btn=>btn.onclick=()=>{field=btn.dataset.field;document.querySelectorAll("[data-field]").forEach(x=>x.classList.remove("active"));btn.classList.add("active");render()});
