<style>
:root{
  --bg:#f4f5f7; --card:rgba(255,255,255,.88); --text:#172033; --muted:#697386;
  --line:#e4e7ec; --accent:#5b5ce2; --accent2:#7c3aed; --good:#16845b;
  --shadow:0 12px 35px rgba(17,24,39,.08);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 15% 0%, rgba(124,58,237,.12), transparent 30%),
    radial-gradient(circle at 90% 8%, rgba(59,130,246,.12), transparent 28%),
    var(--bg);
}
.hero{
  color:white; background:linear-gradient(135deg,#171b35 0%,#29275f 55%,#4c3ca8 100%);
  padding:calc(env(safe-area-inset-top) + 28px) 18px 28px;
  box-shadow:0 8px 30px rgba(23,27,53,.2);
}
.hero-inner{max-width:900px;margin:auto}
.brand{display:flex;align-items:center;gap:12px}
.bookmark{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:rgba(255,255,255,.13);font-size:24px;border:1px solid rgba(255,255,255,.15)
}
h1{margin:0;font-size:27px;letter-spacing:-.5px}
.tagline{margin:6px 0 20px;color:rgba(255,255,255,.72);font-size:14px}
.search-wrap{position:relative}
.search{
  width:100%;padding:16px 50px 16px 17px;border:0;border-radius:17px;
  font-size:17px;outline:none;background:rgba(255,255,255,.98);color:#111827;
  box-shadow:0 10px 28px rgba(0,0,0,.16)
}
.clear{position:absolute;right:10px;top:8px;width:40px;height:40px;border:0;border-radius:12px;background:#eef0f5;color:#555;display:none;font-size:20px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.control{
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:white;
  border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer
}
.control.active{background:white;color:#28275f}
.regex-info{margin-top:10px;color:rgba(255,255,255,.66);font-size:12px;display:none}
main{max-width:900px;margin:auto;padding:16px 15px calc(36px + env(safe-area-inset-bottom))}
.stats{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:9px 12px;font-size:13px;box-shadow:0 2px 8px rgba(17,24,39,.03)}
.stat b{font-size:15px;margin-right:3px}
.list{display:grid;grid-template-columns:1fr;gap:10px}
.card{
  position:relative;background:var(--card);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:17px;padding:16px 17px;
  box-shadow:var(--shadow);transition:transform .15s ease
}
.card:active{transform:scale(.99)}
.title{font-size:17px;font-weight:700;line-height:1.35;padding-right:30px}
.author{margin-top:6px;color:var(--muted);font-size:14px}
.badge{
  position:absolute;right:13px;top:13px;color:#a0a7b5;font-size:11px;
  background:#f0f1f4;border-radius:999px;padding:4px 7px
}
.empty{text-align:center;padding:55px 20px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:8px}
.hint{font-size:13px;line-height:1.5}
mark{background:#fff0a8;color:inherit;border-radius:4px;padding:0 2px}
footer{text-align:center;color:#9aa1ad;font-size:12px;padding:20px 5px}
@media(min-width:680px){.list{grid-template-columns:1fr 1fr}.hero{padding-left:24px;padding-right:24px}}
</style>
</head>

const norm = s => s.toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9]+/g," ").trim();

const escapeHtml = s => s.replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

function highlight(text, query, regexMode){
  const safe = escapeHtml(text);
  if(!query) return safe;
  try {
    if(regexMode) {
      const re = new RegExp(query, "gi");
      return safe.replace(re, m => `<mark>${m}</mark>`);
    }
    const words = norm(query).split(/\s+/).filter(Boolean);
    if(!words.length) return safe;
    const escaped = words.map(x => x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
    return safe.replace(new RegExp("\\b(" + escaped.join("|") + ")\\b","ig"), "<mark>$1</mark>");
  } catch(e) { return safe; }
}

let field = "all";
let regexMode = false;

function matches(book, query){
  if(!query) return true;
  const target = field === "title" ? book.title : field === "author" ? book.author : `${book.title} — ${book.author}`;
  if(regexMode){
    try { return new RegExp(query, "i").test(target); }
    catch(e) { return false; }
  }
  const q = norm(query);
  if(!q) return true;
  // Whole-word matching prevents "Stephen King" from matching "Stephen Hawking".
  const tokens = q.split(/\s+/).filter(Boolean);
  const targetNorm = norm(target);
  return tokens.every(t => new RegExp("\\b" + t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "\\b","i").test(targetNorm));
}

function render(){
  const query = document.getElementById("search").value.trim();
  const results = BOOKS.filter(b => matches(b, query));
  document.getElementById("count").textContent = results.length;
  document.getElementById("status").textContent = query ? (regexMode ? "Regex results" : "Search results") : "Your collection";
  document.getElementById("clear").style.display = query ? "block" : "none";

  const list = document.getElementById("list");
  if(!results.length){
    list.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <div class="empty-icon">🔎</div>
      <strong>No matching book found</strong>
      <p class="hint">${regexMode ? "Check your regular expression." : "Try fewer words, or switch to Regex mode for advanced searches."}</p>
    </div>`;
    return;
  }
  list.innerHTML = results.map(b => `
    <article class="card">
      <span class="badge">#${b.sno}</span>
      <div class="title">${highlight(b.title, query, regexMode)}</div>
      <div class="author">${highlight(b.author, query, regexMode)}</div>
    </article>
  `).join("");
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("clear").addEventListener("click", () => {
  document.getElementById("search").value="";
  render();
  document.getElementById("search").focus();
});

document.querySelectorAll("[data-field]").forEach(btn => {
  btn.addEventListener("click", () => {
    field=btn.dataset.field;
    document.querySelectorAll("[data-field]").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    render();
  });
});

document.getElementById("regexBtn").addEventListener("click", () => {
  regexMode=!regexMode;
  document.getElementById("regexBtn").classList.toggle("active", regexMode);
  document.getElementById("regexInfo").style.display=regexMode?"block":"none";
  render();
});

render();
</script>
