const $=x=>document.getElementById(x), norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function target(b){return [b.title,b.author,b.isbn,b.series,b.genre].join(" ")}
function match(b,q){if(!q)return true;if(regex){try{return new RegExp(q,"i").test(target(b))}catch(e){return false}}let t=norm(target(b));return norm(q).split(/\s+/).every(x=>new RegExp("\\b"+x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i").test(t))}
function hi(s,q){if(!q)return esc(s);try{if(regex)return esc(s).replace(new RegExp(q,"gi"),m=>"<mark>"+m+"</mark>");return esc(s).replace(new RegExp("\\b("+norm(q).split(/\s+/).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","ig"),m=>"<mark>"+m+"</mark>")}catch(e){return esc(s)}}

function render(){let q=$("search").value.trim(),r=books.filter(b=>(filter==="all"||filter==="regex"||b.status===filter)&&match(b,q));$("total").textContent=books.length;$("unread").textContent=books.filter(b=>b.status==="unread").length;$("read").textContent=books.filter(b=>b.status==="read").length;$("result").textContent=q?r.length+" result"+(r.length===1?"":"s"):(filter==="all"?"Your collection":filter[0].toUpperCase()+filter.slice(1)+" books");
$("list").innerHTML=r.length?r.map(b=>'<article class="card"><div class="title">'+hi(b.title,q)+'</div><div class="author">'+hi(b.author,q)+'</div>'+badge(b.status)+(b.series?'<div class="meta">Series: '+esc(b.series)+'</div>':"")+(b.isbn?'<div class="meta">ISBN: '+esc(b.isbn)+'</div>':"")+'<div class="actions"><button class="small" onclick="editBook('+b.id+')">✏️ Edit</button><button class="small" onclick="cycleStatus('+b.id+')">🔄 Status</button><button class="small" onclick="deleteBook('+b.id+')">🗑️ Delete</button></div></article>').join(""):'<div class="empty" style="grid-column:1/-1">🔎<p><strong>No matching books</strong></p><p>Try another search or add this book.</p></div>'}
function openForm(b){editing=b?b.id:null;formStatus=b?.status||"unread";$("heading").textContent=b?"Edit book":"Add book";$("title").value=b?.title||"";$("author").value=b?.author||"";$("isbn").value=b?.isbn||"";$("series").value=b?.series||"";$("genre").value=b?.genre||"";$("notes").value=b?.notes||"";document.querySelectorAll("[data-s]").forEach(x=>x.classList.toggle("sel",x.dataset.s===formStatus));$("overlay").classList.add("show")}
function closeForm(){$("overlay").classList.remove("show");editing=null}
function editBook(id){let b=books.find(x=>x.id===id);if(b)openForm(b)}function deleteBook(id){let b=books.find(x=>x.id===id);if(b&&confirm('Remove "'+b.title+'"?')){books=books.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(books));render()}}
function cycleStatus(id){let b=books.find(x=>x.id===id);if(!b)return;b.status=b.status==="unread"?"reading":b.status==="reading"?"read":"unread";localStorage.setItem(KEY,JSON.stringify(books));render()}
function submit(){let title=$("title").value.trim(),author=$("author").value.trim();if(!title||!author){alert("Please enter title and author.");return}let o={title,author,isbn:$("isbn").value.trim(),series:$("series").value.trim(),genre:$("genre").value.trim(),notes:$("notes").value.trim(),status:formStatus};if(editing)Object.assign(books.find(x=>x.id===editing),o);else{o.id=Date.now();books.push(o)}localStorage.setItem(KEY,JSON.stringify(books));closeForm();render()}
$("add").onclick=()=>openForm();$("cancel").onclick=closeForm;$("save").onclick=submit;$("search").oninput=render;$("overlay").onclick=e=>{if(e.target===$("overlay"))closeForm()};document.querySelectorAll("[data-f]").forEach(x=>x.onclick=()=>{filter=x.dataset.f;regex=filter==="regex";document.querySelectorAll("[data-f]").forEach(y=>y.classList.remove("active"));x.classList.add("active");render()});document.querySelectorAll("[data-s]").forEach(x=>x.onclick=()=>{formStatus=x.dataset.s;document.querySelectorAll("[data-s]").forEach(y=>y.classList.toggle("sel",y.dataset.s===formStatus))});render();
